<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ title or "Invoice" }}</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: #1a1a1a;
        background: #fff;
        max-width: 780px;
        margin: 0 auto;
        padding: 3rem 2rem;
      }

      .invoice-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 3rem;
        padding-bottom: 2rem;
        border-bottom: 2px solid #111;
      }

      .invoice-brand {
        font-size: 1.5rem;
        font-weight: 700;
        color: #111;
        letter-spacing: -0.5px;
      }

      .invoice-meta {
        text-align: right;
        font-size: 0.875rem;
        color: #555;
      }

      .invoice-meta strong {
        display: block;
        font-size: 1.1rem;
        font-weight: 700;
        color: #111;
        margin-bottom: 4px;
      }

      h2 {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #888;
        margin: 2rem 0 0.5rem;
      }

      h3 {
        font-size: 1rem;
        margin: 0 0 0.25rem;
      }
      p {
        margin: 0 0 0.5rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
        font-size: 0.9em;
      }

      th {
        background: #111;
        color: #fff;
        font-weight: 600;
        text-align: left;
        padding: 0.6rem 0.85rem;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      td {
        padding: 0.65rem 0.85rem;
        border-bottom: 1px solid #eee;
      }

      tr:last-child td {
        border-bottom: none;
      }

      td:last-child,
      th:last-child {
        text-align: right;
      }

      .total-row td {
        font-weight: 700;
        font-size: 1rem;
        border-top: 2px solid #111;
        padding-top: 0.85rem;
      }

      ul {
        padding-left: 1.25rem;
        margin: 0.4rem 0 0.75rem;
      }
      li {
        margin-bottom: 0.25rem;
      }

      @media print {
        body {
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="invoice-header">
      <div class="invoice-brand">{{ author or "Your Company" }}</div>
      <div class="invoice-meta">
        <strong>{{ title or "Invoice" }}</strong>
        {% if date %}<span>{{ date }}</span>{% endif %}
      </div>
    </div>

    <main>{{ content | safe }}</main>
  </body>
</html>
