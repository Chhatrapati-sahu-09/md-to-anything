<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{ title or "Resume" }}</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
          sans-serif;
        font-size: 14px;
        line-height: 1.6;
        color: #1a1a1a;
        background: #fff;
        max-width: 820px;
        margin: 0 auto;
        padding: 2.5rem 2rem;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        margin: 0 0 0.2rem;
        color: #111;
        letter-spacing: -0.5px;
      }

      .meta {
        font-size: 0.875rem;
        color: #555;
        margin-bottom: 2rem;
        display: flex;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      h2 {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #888;
        border-bottom: 1px solid #e5e5e5;
        padding-bottom: 0.3rem;
        margin: 2rem 0 0.75rem;
      }

      h3 {
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 0.2rem;
        color: #111;
      }

      p {
        margin: 0 0 0.75rem;
      }

      ul {
        padding-left: 1.25rem;
        margin: 0.4rem 0 0.75rem;
      }

      li {
        margin-bottom: 0.25rem;
      }

      a {
        color: #0070f3;
        text-decoration: none;
      }

      strong {
        font-weight: 600;
      }

      code {
        font-family: "SF Mono", "Fira Code", monospace;
        font-size: 0.8em;
        background: #f4f4f4;
        padding: 0.1em 0.35em;
        border-radius: 3px;
      }

      @media print {
        body {
          padding: 0;
        }
        a {
          color: inherit;
        }
      }
    </style>
  </head>
  <body>
    <h1>{{ title }}</h1>
    <div class="meta">
      {% if author %}<span>{{ author }}</span>{% endif %} {% if date %}<span
        >{{ date }}</span
      >{% endif %}
    </div>

    <main>{{ content | safe }}</main>
  </body>
</html>
